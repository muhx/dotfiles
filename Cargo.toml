[package]
name = "rstuck"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Manage my productivity setup: packages, tools and config files"
publish = false

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
toml = "1.2.3"
